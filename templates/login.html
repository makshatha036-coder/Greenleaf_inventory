{% extends "base.html" %}{% block title %}Log in - GreenLeaf{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Log in</h1>
  <form method="post">
    <label for="u">Username</label><input id="u" name="username" required autofocus style="width:100%">
    <label for="p">Password</label><input id="p" name="password" type="password" required style="width:100%">
    <p><button type="submit">Log in</button></p>
  </form>
  <p class="muted">Demo accounts: admin / admin123, cashier / cashier123</p>
</div>
{% endblock %}
