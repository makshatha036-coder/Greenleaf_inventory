{% extends "base.html" %}{% block title %}{{ 'Edit' if editing else 'Add' }} product{% endblock %}
{% block content %}
<h1>{{ 'Edit product' if editing else 'Add product' }}</h1>
<div class="card" style="max-width:520px"><form method="post">
  <label for="name">Name</label><input id="name" name="name" value="{{ p.name or '' }}" required style="width:100%">
  <label for="category">Category</label><input id="category" name="category" list="cats" value="{{ p.category or '' }}" required style="width:100%">
  <datalist id="cats">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist>
  <label for="unit_price">Unit price (₹)</label><input id="unit_price" name="unit_price" type="number" step="0.01" min="0" value="{{ p.unit_price if p.unit_price is not none else '' }}" required>
  <label for="stock_qty">Stock quantity</label><input id="stock_qty" name="stock_qty" type="number" step="1" min="0" value="{{ p.stock_qty if p.stock_qty is not none else '' }}" required>
  <label for="reorder_level">Reorder level</label><input id="reorder_level" name="reorder_level" type="number" step="1" min="0" value="{{ p.reorder_level if p.reorder_level is not none else 10 }}">
  <label for="expiry_date">Expiry date (optional)</label><input id="expiry_date" name="expiry_date" type="date" value="{{ p.expiry_date or '' }}">
  <label for="supplier_id">Supplier (optional)</label>
  <select id="supplier_id" name="supplier_id"><option value="">None</option>
    {% for s in suppliers %}<option value="{{ s.supplier_id }}" {{ 'selected' if p.supplier_id == s.supplier_id }}>{{ s.name }}</option>{% endfor %}</select>
  <p><button type="submit">Save product</button> <a class="btn alt" href="{{ url_for('main.products') }}">Cancel</a></p>
</form></div>
{% endblock %}
